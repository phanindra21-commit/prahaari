# Render Blueprint — single-origin hosted demo (web + API on one service).
# MongoDB lives on MongoDB Atlas (free M0). The ML service is NOT deployed in
# this demo: map, scores, worklist, decisions and audit use data already in
# MongoDB; the scenario simulator needs the ML service and is disabled.
services:
  - type: web
    name: prahari-demo
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && VITE_API_URL=/api/v1 npm run build
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: SERVE_WEB_DIST
        value: apps/web/dist
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://prahari-demo.onrender.com
